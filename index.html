<script>
(function(){
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let DPR=1, CW=960, CH=540;

const input={left:false,right:false,up:false,down:false,crouch:false};
let game=null;
let audio=null;
let musicTimer=null, musicStep=0;

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  CW=window.innerWidth; CH=Math.max(320,window.innerHeight-104);
  canvas.width=Math.floor(CW*DPR);
  canvas.height=Math.floor(CH*DPR);
}
window.addEventListener('resize',resize);
resize();

function startAudio(){
  try{
    if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended') audio.resume();
    startMusic();
  }catch(e){}
}
function musicTone(freq,dur,when,volume=.022,type='triangle'){
 try{
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,when);
  g.gain.setValueAtTime(.0001,when);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),when+.006);
  g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g);g.connect(audio.destination);o.start(when);o.stop(when+dur+.02);
 }catch(e){}
}
function melodyTone(freq,dur,when,volume=.018,type='triangle'){
 try{const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(volume,when+.02);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(audio.destination);o.start(when);o.stop(when+dur+.03)}catch(e){}
}
function musicBass(freq,dur,when){melodyTone(freq,dur,when,.012,'sine')}
function stopMusic(){if(musicTimer){clearTimeout(musicTimer);musicTimer=null}}
function startMusic(level=1){
 if(!audio)return;stopMusic();
 // Familiar public-domain melodies, played as short original instrumental phrases.
 const songs=[
  [261.63, [0,2,4,5,4,2,0,-1,0,2,4,5,7,5,4,2]], // Ode to Joy
  [293.66,[0,2,3,4,3,2,0,-1,0,2,3,5,4,3,2,0]], // Greensleeves-like
  [220,[0,4,5,7,9,7,5,4,2,4,5,7,9,11,9,7]],
  [246.94,[0,2,4,7,5,4,2,0,2,4,5,9,7,5,4,2]]
 ];
 const [root,steps]=songs[(level-1)%songs.length];
 const major=[1,1.12246,1.25992,1.33484,1.49831,1.68179,1.88775,2];
 const step=.22,bar=steps.length*step;let seq=0;
 function schedule(){
  const now=audio.currentTime+.04;
  for(let i=0;i<steps.length;i++){
   const t=now+i*step, idx=Math.max(0,Math.min(7,steps[(i+seq)%steps.length]+1));
   melodyTone(root*major[idx],.19,t,.018,'sine');
   if(i%2===0)musicBass(root/2,.15,t,.01);
   if(i===0||i===8)melodyTone(root*2,.12,t,.008,'triangle');
  }
  seq=(seq+2)%steps.length;musicTimer=setTimeout(schedule,bar*1000-30);
 }
 schedule();
}
function sound(freq,duration,type='sine'){
  try{
    startAudio();
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=.035;
    o.connect(g);g.connect(audio.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    o.stop(audio.currentTime+duration);
  }catch(e){}
}




let currentLevel=1,totalScore=0;
function seeded(seed){let x=(seed*1664525+1013904223)>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}
const seasons=['Зима','Весна','Лето','Осень'],times=['День','Закат','Ночь','Рассвет'];
const skyPalettes=[['#07101f','#172d50','#101827','#dbe8ff'],['#5d2740','#b85f61','#29364d','#ffd39a'],
['#2f6f8f','#8fc2d5','#d9e7dc','#fff2a8'],['#2c5b39','#7aa15d','#d8d0a2','#fff0c0'],
['#4a294f','#9b638d','#202844','#e9dcff'],['#182d4d','#466f9e','#b9c8d9','#f7f1d0'],
['#6b3824','#b86b3f','#3c2c2a','#ffd58a'],['#10162e','#3b3d75','#12182a','#e9ecff']];
function makeLevel(n){
 const r=seeded(1000+n*7919),d=n/50;
 const season=seasons[Math.floor(r()*4)],time=times[Math.floor(r()*4)],palette=skyPalettes[Math.floor(r()*skyPalettes.length)];
 const floors=[];let x=0;
 const fc=12+Math.floor(d*6);
 // From level 3 only the deliberately selected 2–5 chasms are wide.
 // Every wide chasm gets a moving platform; all other gaps stay jumpable.
 const movingGapCount=n>=3?Math.min(5,Math.max(2,2+Math.floor(r()*4))):0;
 const movingGapIndices=[];
 for(let i=0;i<fc-1;i++)movingGapIndices.push(i);
 for(let i=movingGapIndices.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[movingGapIndices[i],movingGapIndices[j]]=[movingGapIndices[j],movingGapIndices[i]]}
 const wideGaps=new Set(movingGapIndices.slice(0,movingGapCount));
 for(let i=0;i<fc;i++){
   const w=(i===0?680:300+Math.floor(r()*(190-d*35)));
   floors.push([x,1080,w,90]);
   if(i<fc-1){
     const gap=n>=3?(wideGaps.has(i)?285+Math.floor(r()*(55+d*45)):145+Math.floor(r()*(38+d*18))):(65+Math.floor(r()*(55+d*45)));
     x+=w+gap;
   }
 }
 // A wide final platform guarantees a clean, dramatic end sequence.
 const finalFloor=[x,1080,620,90];floors.push(finalFloor);x+=finalFloor[2];
 const uppers=[],uc=9+Math.floor(d*7);
 for(let i=0;i<uc;i++){
   const px=120+Math.floor(r()*Math.max(200,x-500)),py=700+Math.floor(r()*190),pw=190+Math.floor(r()*(180-d*25));
   uppers.push([px,py,pw,55]);
 }
 uppers.sort((a,b)=>a[0]-b[0]);
 const MIN_OBSTACLE_GAP=95;
 function objs(count,gap){
   const out=[];let tries=0;
   while(out.length<count&&tries++<3000){
    const f=floors[Math.floor(r()*floors.length)],ox=f[0]+25+r()*Math.max(20,f[2]-85);
    if(f===finalFloor && ox>finalFloor[0]+finalFloor[2]-260)continue;
    if(out.every(v=>v.f!==f || ox>v.x+v.w+gap || v.x>ox+85+gap))out.push({x:ox,w:85,f});
   }
   return out;
 }
 const spikes=objs(7+Math.floor(d*16),MIN_OBSTACLE_GAP).map(o=>({x:o.x,y:1060,w:45+Math.floor(r()*55),h:20}));
 for(let i=0;i<Math.floor(4+d*10);i++){
   const u=uppers[Math.floor(r()*uppers.length)],ox=u[0]+20+r()*Math.max(20,u[2]-70);
   spikes.push({x:ox,y:u[1]-20,w:35+Math.floor(r()*45),h:20});
 }
 const lava=n>=3?objs(3+Math.floor(d*9),MIN_OBSTACLE_GAP).map(o=>({x:o.x,y:1060,w:75+Math.floor(r()*105),h:24})) : [];
 const acid=n>=6?objs(3+Math.floor(d*8),MIN_OBSTACLE_GAP).map(o=>({x:o.x,y:1060,w:75+Math.floor(r()*110),h:24})) : [];
 // Additional hazards on upper floors: lava from level 3, acid from level 6.
 const upperLava=n>=3?[]:[];
 const upperAcid=n>=6?[]:[];
 for(const u of uppers){
   if(n>=3 && r()<.42){ const w=55+Math.floor(r()*85); const ox=u[0]+20+r()*Math.max(20,u[2]-w-35); upperLava.push({x:ox,y:u[1]-24,w,h:24}); }
   if(n>=6 && r()<.36){ const w=55+Math.floor(r()*90); const ox=u[0]+20+r()*Math.max(20,u[2]-w-35); upperAcid.push({x:ox,y:u[1]-24,w,h:24}); }
 }
 lava.push(...upperLava); acid.push(...upperAcid);
 // Moving stone platforms occupy every deliberately wide chasm.
 const movingPlatforms=[];
 if(n>=3){
   for(let i=0;i<floors.length-1;i++){
     const a=floors[i],b=floors[i+1],gap=b[0]-(a[0]+a[2]);
     if(gap<250)continue;
     const edgeClearance=58;
     const w=Math.max(100,Math.min(132,gap-edgeClearance*2));
     const minX=a[0]+a[2]+edgeClearance;
     const maxX=b[0]-w-edgeClearance;
     if(maxX<minX)continue;
     // 1178 places the platform clearly below the road surface (which ends at 1170),
     // while keeping its upper half visible inside the gameplay viewport.
     const y=1178;
     movingPlatforms.push({x:minX,y,w,h:48,minX,maxX,dir:r()<.5?1:-1,speed:1.15+r()*1.35,phase:r()*Math.PI*2});
   }
 }
 let rocks=objs(5+Math.floor(d*13),MIN_OBSTACLE_GAP).map(o=>({x:o.x,y:1010,w:55+Math.floor(r()*40),h:50+Math.floor(r()*25),f:o.f}));
 // Never place a rock near a cliff edge.  A rock within this zone could
 // block the take-off point and make a jump across the chasm impossible.
 rocks=rocks.filter(rock=>{
   const f=rock.f;
   const edgeZone=135;
   const leftEdge=rock.x-f[0],rightEdge=f[0]+f[2]-(rock.x+rock.w);
   return leftEdge>=edgeZone && rightEdge>=edgeZone;
 }).map(({f,...rock})=>rock);
 function spacedObstacles(arrays,gap=MIN_OBSTACLE_GAP){
  const all=[];
  for(const arr of arrays)for(const o of arr){
   const surface=Math.round(o.y),prev=all.filter(v=>Math.abs(v.surface-surface)<5);
   if(prev.some(v=>o.x<v.x+v.w+gap&&v.x+o.w>v.x-gap)){o._remove=true}else all.push({x:o.x,w:o.w,surface,ref:o});
  }
  for(const arr of arrays)for(let i=arr.length-1;i>=0;i--)if(arr[i]._remove){delete arr[i]._remove;arr.splice(i,1)}
 }
 spacedObstacles([spikes,lava,acid,rocks]);
 // Keep the take-off and landing lips of moving-platform chasms clear.
 // If lava/acid was generated too close to a cliff, move it farther right on
 // the same floor when there is room; otherwise remove that hazard.
 if(n>=3){
   for(let i=0;i<floors.length-1;i++){
     const a=floors[i],b=floors[i+1],gap=b[0]-(a[0]+a[2]);
     if(gap<250)continue;
     const safe=150;
     for(const arr of [lava,acid]){
       for(let j=arr.length-1;j>=0;j--){
         const o=arr[j];
         const onA=o.x>=a[0]&&o.x<a[0]+a[2],onB=o.x>=b[0]&&o.x<b[0]+b[2];
         if(!onA&&!onB)continue;
         if(onA && a[0]+a[2]-(o.x+o.w)<safe){
           const nx=a[0]+a[2]-safe-o.w;
           if(nx>=a[0]+35)o.x=nx; else arr.splice(j,1);
         }
         if(onB && o.x-b[0]<safe){
           const nx=b[0]+safe;
           if(nx+o.w<=b[0]+b[2]-35)o.x=nx; else arr.splice(j,1);
         }
       }
     }
   }
 }
 // Never place hazards in the final key/door approach.
 for(const arr of [spikes,lava,acid,rocks])for(let i=arr.length-1;i>=0;i--)if(arr[i].x>finalFloor[0]+finalFloor[2]-285)arr.splice(i,1);
 const enemies=[],ec=10+Math.floor(d*15);
 for(let i=0;i<ec;i++){
  const up=n>=3&&r()<.38,pl=up?uppers[Math.floor(r()*uppers.length)]:floors[Math.floor(r()*floors.length)];
  if(pl===finalFloor&&pl[0]+pl[2]-350<pl[0]+30)continue;
  const ex=pl[0]+30+r()*Math.max(20,pl[2]-75);
  if(ex<390|| (pl===finalFloor&&ex>finalFloor[0]+finalFloor[2]-300))continue;
  enemies.push({x:ex,y:pl[1]-70,hp:2,variant:Math.floor(r()*4)});
 }
 const START_SAFE_X=340;
 for(const arr of [spikes,lava,acid,rocks])for(let i=arr.length-1;i>=0;i--)if(arr[i].x<START_SAFE_X)arr.splice(i,1);
 for(let i=enemies.length-1;i>=0;i--)if(enemies[i].x<START_SAFE_X)enemies.splice(i,1);
 // Decorative pressure plate remains, but the final door is now opened ONLY by the key.
 const buttonFloor=floors[0],bw=72,minX=390,maxX=Math.max(minX+1,buttonFloor[2]-bw-90);
 const button={x:buttonFloor[0]+minX+(maxX-minX)*r(),y:1052,w:bw,h:28,pressed:false};
 // The key is randomized anywhere except the starting and final platforms.
 const keyPlatforms=floors.slice(1,-1).concat(uppers);
 const kp=keyPlatforms[Math.floor(r()*keyPlatforms.length)]||finalFloor;
 const keyX=kp[0]+35+r()*Math.max(20,kp[2]-70);
 const key=[keyX,kp[1]-58];
 const door={x:finalFloor[0]+finalFloor[2]-82,y:finalFloor[1]-76,w:58,h:76,open:false};
 // Poisonous creatures begin on level 3; beetles on level 5.
 const caterpillars=[],beetles=[];
 if(n>=3){
   const cc=3+Math.floor(d*5);
   for(let i=0;i<cc;i++){const f=floors[Math.floor(r()*Math.max(1,floors.length-1))]; if(f===finalFloor)continue; caterpillars.push({x:f[0]+40+r()*Math.max(20,f[2]-70),y:f[1]-18,w:42,h:18,dir:r()<.5?-1:1,vx:0,alive:true,phase:r()*6.28,hp:2,hitFlash:0,dying:0,superDying:false});}
 }
 if(n>=5){
   const bc=2+Math.floor(d*5);
   for(let i=0;i<bc;i++){const f=floors[Math.floor(r()*Math.max(1,floors.length-1))]; if(f===finalFloor)continue; beetles.push({x:f[0]+40+r()*Math.max(20,f[2]-70),y:f[1]-22,w:38,h:22,dir:r()<.5?-1:1,vx:0,alive:true,phase:r()*6.28,hp:2,hitFlash:0,dying:0,superDying:false});}
 }
 return {number:n,difficulty:d,season,time,palette,platforms:floors.concat(uppers),key,keyPlatform:kp,spikes,lava,acid,rocks,enemies,button,door,movingPlatforms,caterpillars,beetles,worldWidth:x+80,name:`Уровень ${n} — ${season}, ${time}`};
}
function createLevelVariant(){return makeLevel(currentLevel)}

function createRandomLadders(){
  const lower=game.platforms.filter(q=>q.y===1080);
  const upper=game.platforms.filter(q=>q.y<1080);
  const candidates=[];
  for(const u of upper){
    for(const b of lower){
      const left=Math.max(u.x+18,b.x+18);
      const right=Math.min(u.x+u.w-18,b.x+b.w-18);
      if(right-left>=46){
        const lx=left+(right-left-46)*Math.random();
        // Never put a ladder directly over the opening button.
        if(!(b.y===1080 && lx+46>game.button.x-12 && lx<game.button.x+game.button.w+12)){
          candidates.push({x:lx,top:u.y,bottom:b.y,w:46});
          break;
        }
      }
    }
  }
  const keyPlatform=upper.find(q=>game.key &&
    game.key.x+game.key.w/2>=q.x &&
    game.key.x+game.key.w/2<=q.x+q.w);
  const keyCandidate=keyPlatform && candidates.find(l=>
    l.top===keyPlatform.y &&
    l.x+23>=keyPlatform.x && l.x+23<=keyPlatform.x+keyPlatform.w);
  const rest=candidates.filter(l=>l!==keyCandidate);
  for(let i=rest.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [rest[i],rest[j]]=[rest[j],rest[i]];
  }
  const chosen=[];
  if(keyCandidate)chosen.push(keyCandidate);
  for(const l of rest){
    if(chosen.length>=4)break;
    if(chosen.every(c=>Math.abs((c.x+23)-(l.x+23))>150))chosen.push(l);
  }
  return chosen;
}

function newGame(levelNumber=currentLevel){
 startAudio();currentLevel=Math.max(1,Math.min(50,levelNumber));
 const level=createLevelVariant();
 game={running:true,paused:false,won:false,last:performance.now(),time:0,score:0,camera:0,particles:[],bullets:[],superWaves:[],upgrade:null,kills:0,worldWidth:level.worldWidth,
  level:level.number,season:level.season,timeOfDay:level.time,palette:level.palette,
  p:{x:70,y:1004,w:42,h:76,vx:0,vy:0,on:false,ladder:null,hp:3,inv:0,attack:0,attackT:0,dir:1,anim:0,crouch:false,jumpHeld:false,jumpTime:0,jumpBoost:false,weapon:'sword',killsSinceUpgrade:0,shootCooldown:0,jumpBuffer:0,coyote:0,attackHold:false,attackHoldT:0,superAttack:0,superT:0},
  platforms:level.platforms.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]})),ladders:[],
  spikes:level.spikes,lava:level.lava,acid:level.acid,rocks:level.rocks,
  movingPlatforms:level.movingPlatforms||[],caterpillars:level.caterpillars||[],beetles:level.beetles||[],
  enemies:level.enemies.map(e=>makeEnemy(e.x,e.y,e.hp,e.variant)),
  key:{x:level.key[0],y:level.key[1],w:28,h:34,taken:false},door:level.door,button:level.button};
 game.ladders=createRandomLadders();startMusic(currentLevel);
 document.getElementById('levelNo').textContent=currentLevel;showStatus(level.name);
 document.getElementById('menu').style.display='none';document.getElementById('hud').style.display='flex';
 document.getElementById('controls').style.display='flex';document.getElementById('pause').textContent='Ⅱ';updateHud();
 sound(523,.12);setTimeout(()=>sound(659,.12),110);
}

function makeEnemy(x,y,hp,variant=0){
 return {x,y,w:44,h:70,hp:2,alive:true,vx:0,vy:0,on:false,dir:-1,jumpCooldown:.5,variant,hitFlash:0,dying:0,superDying:false};
}

function resetGame(){
  currentLevel=1;totalScore=0;newGame(1);
}

function rect(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function ground(o,oldY){
 o.on=false;
 if(o.vy<0)return;
 for(const q of game.platforms.concat(game.movingPlatforms||[])){
   if(o.x+o.w>q.x+5 && o.x<q.x+q.w-5 &&

function nearLadder(){

      p.y+p.h>l.top-35&&p.y<l.bottom+25)return l;

function jump(){
 if(!game||!game.running||game.paused)return;
 const p=game.p;
 // Jump input is always accepted, including during the short damage/invulnerability window.
 // The buffered request is consumed as soon as the knight is grounded.

 // Queue the jump for a short moment so pressing RIGHT + JUMP together
 // on touch screens never loses the jump because the knight is between
 // collision frames or has just stepped off an edge.
 p.jumpBuffer=.16;
 if(p.ladder){
   p.ladder=null;
   p.vy=-790;
   p.on=false;
   p.coyote=0;
   return;
 }
 if(p.on||p.coyote>0){
   p.vy=-790;
   p.on=false;
   p.jumpHeld=true;
   p.jumpTime=0;
   p.jumpBoost=true;
   p.jumpBuffer=0;
   p.coyote=0;

   sound(440,.08,'square');
 }
}
function climb(){
 if(!game||!game.running||game.paused)return;

 if(!l)return;

 p.vx=0;p.vy=0;
 // If at the bottom, move upward. If at the top, also allow a short
 // upward push so the knight steps onto the upper floor.
 if(p.y>=l.bottom-p.h-8){
   p.y-=Math.min(120, l.bottom-l.top);
 }else{
   p.y=Math.max(l.top-p.h,p.y-110);
 }

   p.y=l.top-p.h;
   p.ladder=null;

}
function descend(){
 if(!game||!game.running||game.paused)return;

 if(!l)return;

function update(dt){

function draw(){

 // Letterbox вместо растягивания.
 const ratio=16/9;
 let w=CW,h=CW/ratio;
 if(h>CH){h=CH;w=CH*ratio}
 const ox=(CW-w)/2,oy=(CH-h)/2;
 ctx.save();ctx.translate(ox,oy);ctx.scale(w/960,h/540);

 drawBackground();

 if(game){
   ctx.save();
   // Fixed vertical framing: the visible game area includes the upper
    // platforms and the first floor, while controls remain completely separate.
    ctx.translate(-game.camera,-660);
   drawWorld();
   ctx.restore();
   // UI animation is drawn in screen space so it cannot disappear behind the world camera.
   if(game.p.superAttack>0)drawSuperLabel(game.p.superT);
   else if(game.p.attackHold)drawSuperCharge(game.p.attackHoldT);

}

  ctx.beginPath();ctx.moveTo(0,300+layer*30);
  for(let x=0;x<=960;x+=70)ctx.lineTo(x,250+layer*28+Math.sin(x*.018+layer)*45);

  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(rr*.62,0,rr*.82,rr*.24,0,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=(1-p)*.95;ctx.strokeStyle='#ffffff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(r*.55,0,r*.42,-.7,.7);ctx.stroke();
 ctx.globalAlpha=(1-p)*.8;ctx.strokeStyle='#86cfff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(r*.78,0,r*.27,-.62,.62);ctx.stroke();
 ctx.restore();
}
function drawBullet(b){
 ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=8;const g=ctx.createLinearGradient(b.x,b.y,b.x+b.w,b.y);g.addColorStop(0,'#fff');g.addColorStop(.45,'#e7b94f');g.addColorStop(1,'#8a5c19');ctx.fillStyle=g;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#fff6bd';ctx.fillRect(b.x+(b.dir>0?b.w:0)-2,b.y-1,2,7);ctx.restore();
}
function drawUpgrade(u){
 const a=Math.min(1,u.t<.35?u.t/.35:u.t>1.7?(2.1-u.t)/.4:1);ctx.save();ctx.globalAlpha=a;ctx.translate(480,145);const pulse=1+Math.sin(performance.now()/90)*.04;ctx.scale(pulse,pulse);
 ctx.fillStyle='#101827e8';ctx.strokeStyle='#d7b566';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-175,-62,350,124,18);ctx.fill();ctx.stroke();
 ctx.fillStyle='#ffd75a';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.fillText('ОРУЖИЕ УЛУЧШЕНО',0,-20);
 ctx.save();ctx.translate(0,23);ctx.rotate(-.08);ctx.fillStyle='#4f565d';ctx.fillRect(-48,-8,95,20);ctx.fillStyle='#16191d';ctx.fillRect(-18,10,30,30);ctx.fillStyle='#b8bec3';ctx.fillRect(42,-6,22,8);ctx.fillStyle='#252a2f';ctx.fillRect(-55,-2,18,9);ctx.restore();ctx.restore();
}
function updateHud(){
 if(!game)return;
 document.getElementById('hp').textContent='♥ '.repeat(game.p.hp).trim();
 document.getElementById('key').textContent=(game.key.taken?'ВЗЯТ':'НЕТ');
 document.getElementById('kills').textContent=game.kills||0;document.getElementById('weaponHud').textContent=game.p.weapon==='gun'?'🔫 ПИСТОЛЕТ':'🗡 МЕЧ';
 document.getElementById('score').textContent=totalScore+game.score;
 const s=Math.floor(game.time);
 document.getElementById('time').textContent=
   String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

function showStatus(t){
 const el=document.getElementById('status');el.textContent=t;el.style.display='block';
 setTimeout(()=>el.style.display='none',900);
}

function showMenu(title,sub){
 document.getElementById('panelText');
 const card=document.querySelector('.card');
 card.innerHTML=title+'<small>'+sub+'</small><button id="start" type="button">⚔ НАЧАТЬ ИГРУ</button>';
 document.getElementById('menu').style.display='flex';
 // Rebind the newly-created button.
 document.getElementById('start').addEventListener('click',function(e){
   e.preventDefault();e.stopPropagation();newGame();
 });
 document.getElementById('hud').style.display='none';
 document.getElementById('controls').style.display='none';
}

// Initial button binding — delegated, so iPhone Safari handles it reliably.
document.getElementById('start').addEventListener('click',function(e){
 e.preventDefault();e.stopPropagation();newGame();
});

function hold(id,prop){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();input[prop]=true},{passive:false});
 b.addEventListener('pointerup',e=>{e.preventDefault();input[prop]=false},{passive:false});
 b.addEventListener('pointercancel',e=>{e.preventDefault();input[prop]=false},{passive:false});
 // Do not use pointerleave or pointer capture: Safari can cancel a second
 // simultaneous touch when the forward button is held.
 b.addEventListener('lostpointercapture',()=>{input[prop]=false});
}
hold('left','left');hold('right','right');hold('crouch','crouch');

const jumpBtn=document.getElementById('up');
function jumpPress(e){
 e.preventDefault();
 input.up=true;
 // Always buffer the jump first; this is critical when RIGHT is already held
 // and iOS Safari delivers the two touch events on adjacent frames.
 if(game&&game.running&&!game.paused){game.p.jumpBuffer=Math.max(game.p.jumpBuffer||0,.35);jump();}
}
jumpBtn.addEventListener('pointerdown',jumpPress,{passive:false});
jumpBtn.addEventListener('pointerup',e=>{e.preventDefault();input.up=false},{passive:false});
jumpBtn.addEventListener('pointercancel',e=>{e.preventDefault();input.up=false},{passive:false});
jumpBtn.addEventListener('lostpointercapture',()=>{input.up=false});
jumpBtn.addEventListener('touchstart',e=>{
 e.preventDefault();
 if(!window.PointerEvent){input.up=true;if(game&&game.running&&!game.paused){game.p.jumpBuffer=Math.max(game.p.jumpBuffer||0,.35);jump();}}
},{passive:false});
jumpBtn.addEventListener('touchend',e=>{e.preventDefault();if(!window.PointerEvent)input.up=false},{passive:false});
document.getElementById('climb').addEventListener('pointerdown',e=>{
 e.preventDefault();
 try{document.getElementById('climb').setPointerCapture(e.pointerId)}catch(_){}
 input.up=true;
 climb();
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
 document.getElementById('climb').addEventListener(ev,e=>{
   e.preventDefault(); input.up=false;
 });
});
document.getElementById('climb').addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('crouch').addEventListener('pointerdown',e=>{
 e.preventDefault();
 const l=nearLadder();
 if(l||game?.p?.ladder) descend();
 else input.crouch=true;
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
 document.getElementById('crouch').addEventListener(ev,e=>{
   e.preventDefault(); input.crouch=false;
 });
});
const attackBtn=document.getElementById('attack');
attackBtn.addEventListener('pointerdown',e=>{e.preventDefault();try{attackBtn.setPointerCapture(e.pointerId)}catch(_){}beginAttackHold();});
['pointerup','pointercancel'].forEach(ev=>attackBtn.addEventListener(ev,e=>{e.preventDefault();endAttackHold();}));
attackBtn.addEventListener('contextmenu',e=>e.preventDefault());

document.getElementById('pause').addEventListener('click',function(){
 if(!game||!game.running)return;
 game.paused=!game.paused;
 this.textContent=game.paused?'▶':'Ⅱ';
});

document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')input.left=true;
 if(e.key==='ArrowRight'||e.key==='d')input.right=true;
 if(e.key==='ArrowDown'||e.key==='s'){input.crouch=true;input.down=true}
 if(e.key==='ArrowUp'||e.key==='w'){
   input.up=true;
   if(!e.repeat)jump();
 }
 if(e.key==='e'||e.key==='E'){if(!e.repeat)climb();}
 if(e.key==='q'||e.key==='Q'){if(!e.repeat)descend();}
 if(e.key==='f'||e.key==='F'){if(!e.repeat)beginAttackHold();}
 if(e.key===' ') {e.preventDefault();if(!e.repeat)jump();}
 if(e.key==='p'||e.key==='P')document.getElementById('pause').click();
});
document.addEventListener('keyup',e=>{if(e.key==='f'||e.key==='F')endAttackHold();});

document.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')input.left=false;
 if(e.key==='ArrowRight'||e.key==='d')input.right=false;
 if(e.key==='ArrowDown'||e.key==='s'){input.crouch=false;input.down=false;}
 if(e.key==='ArrowUp'||e.key==='w')input.up=false;
});

function loop(t){
 const dt=Math.min(.033,(t-(game?.last||t))/1000);
 if(game)game.last=t;
 update(dt);draw();
 requestAnimationFrame(loop);
}

showMenu('🏰 ЗАМОК ЛУНЫ','50 длинных уровней: сражайся с врагами, преодолевай ловушки, забери ключ в самом конце и вернись к двери.');
requestAnimationFrame(loop);

})();
</script>
